# Dependabot abre PRs cuando hay versiones nuevas de las dependencias.
# target-branch: develop, porque la rama por defecto del repositorio es main.
# cooldown: espera 7 días antes de proponer una versión recién publicada, para que
# una versión maliciosa (como trivy v0.69.4 en marzo de 2026) se detecte y retire antes.
version: 2

updates:
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
    groups:
      maven-menores:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      acciones:
        patterns: ['*']

  # Herramientas de Node (commitlint): no forman parte de la API.
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      commitlint:
        patterns: ['@commitlint/*']

  # Imágenes base: solo parches y versiones menores. El proyecto usa versiones LTS a propósito
  # (Java 17, MySQL 8.4); cambiar de versión mayor es una decisión deliberada, no automática.
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: eclipse-temurin
        versions: ['>= 18']

  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      - dependency-name: mysql
        versions: ['>= 9']
