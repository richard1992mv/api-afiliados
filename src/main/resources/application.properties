spring.application.name=afiliados

# --- Base de datos (MySQL 8) ---
# Los valores vienen de variables de entorno, sin valores por defecto:
# si falta alguna, la aplicación no arranca (fail fast) en lugar de usar
# una credencial escondida en el código.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# El esquema lo gestiona Flyway; Hibernate solo valida que las entidades coincidan.
spring.jpa.hibernate.ddl-auto=validate
# Evita mantener la sesión de BD abierta durante la vista (antipatrón y fuga de recursos).
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.locations=classpath:db/migration

# --- Actuator ---
# Expone solo el health check; el resto de endpoints puede filtrar información interna.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- OpenAPI / Swagger ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Errores ---
# No devolver trazas ni mensajes internos al cliente.
server.error.include-stacktrace=never
server.error.include-message=never
